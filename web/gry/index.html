<!-- RibbitBeat (dawniej „Żabi chór”): powłoka gry i harness w jednym pliku.
     Ścieżki do zasobów są WZGLĘDNE (../assets/…), bo ten katalog działa i jako /gry/ (py -m http.server
     z katalogu web/, tools/gry_serwer.py), i jako /web/gry/ w samej aplikacji (przycisk „Gra” w menu).
     Fonty marki (SIL OFL) bierzemy z ../assets/fonts przez własne @font-face w gry.css, bez CSS aplikacji.
     Parametry adresu (harness 2/2 na dole):
       piosenka=oda       id piosenki (scarborough, oda, panie-janie, kotek, gwiazdka, mary, buns, jingle)
       auto=1&czekaj=3    start bez klikania po N sekundach lobby (czas gry, więc ZC.ff też go przewija)
       boty=3             żaby-boty na poziomie z lobby;  luz=0.3  zamiast poziomu dawna niedbałość 0..1
       ziarno=7           powtarzalny los botów
       mysz=1             mysz od razu w chórze;  zywe=1  kapsle z /stream aplikacji (pod /web/gry/, czyli
                          w samej aplikacji, włączone bez parametru; zywe=0 wyłącza)
       partie=kolejno     gracze po kolei na partie 0,1,2,3… (albo lista: partie=0,1,1,2)
       tempo=80 glos=ribbit latwy=1 fps=1 -->

<script>
"use strict";
// HARNESS 1/2: wirtualny zegar. performance.now() = prawdziwy czas +
// przesunięcie, które dokłada ZC.ff(sek). Stoi PRZED skryptami gry, bo one czytają zegar od pierwszej klatki.
(function(){
  const prawdziwy=performance.now.bind(performance);let przesuniecie=0;
  performance.now=()=>prawdziwy()+przesuniecie;
  window.__zcPrzesunZegar=ms=>{przesuniecie+=ms;};
})();
</script>
<!-- Ekran wczytywania (js/wczytywanie.js): klasa html.wczytuje od pierwszego bajtu, zasłona to pierwszy element body.
     Wygląd sceny (11-19): ciemny filc ze ściegiem, reflektor, girlanda bujanych lamp z menu, promienie za żabą, korektor
     i pasek jak naszywka. Lekko: tło to gradienty CSS malowane raz, pliki są dwa (żaba i lampy), a rusza się wyłącznie
     transform i krycie (kompozytor), więc wszystko
     chodzi płynnie, nawet gdy pod spodem trwa ciężki start. Ten sam wygląd ma zasłona utworu (zabi-chor.js). -->
<script>document.documentElement.classList.add("wczytuje");</script>
<style>
html.wczytuje{background:#1b1917}
.wczytywanie{--wt:.46875s;position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.2vh,24px);
  overflow:hidden;background:radial-gradient(ellipse 80vmin 70vmin at 50% 42%,rgba(236,26,131,.30),rgba(236,26,131,.10) 46%,rgba(236,26,131,0) 78%),#1b1917;
  opacity:.999;transition:opacity .35s ease;pointer-events:none}
/* krycie .999, nie 1: pod w pełni kryjącą warstwą przeglądarka nie maluje menu (pomija zasłonięte kafle) i robiła to
   dopiero przy znikaniu zasłony, 100–170 ms zacięcia; tak menu rasteryzuje się pod zasłoną w trakcie wczytywania */
.wczytywanie.znika{opacity:0}
.wczytywanie::before{content:"";position:absolute;inset:clamp(12px,2.2vmin,26px);border:2px dashed rgba(239,233,221,.24);border-radius:clamp(16px,3vmin,30px)}
/* girlanda jak w menu (11-19): filcowe żarówki z grafiki menu w trzech kolorach (jeden plik, wybór koloru przez
   object-position), zawieszone na kablu ze zwisami między nitami. Każda buja się we własnym tempie, a poświata przebiega
   po kolorach na kolejne ćwierćnuty muzyki (3 × --wt). Rusza się tylko transform i krycie, kabel i poświaty malują się raz. */
.wcz-girlanda{position:absolute;z-index:1;left:calc(clamp(12px,2.2vmin,26px) + 14px);right:calc(clamp(12px,2.2vmin,26px) + 14px);top:calc(clamp(12px,2.2vmin,26px) + 6px);
  height:clamp(34px,7.4vmin,84px);--wl:clamp(34px,6.6vmin,78px)}
.wcz-kabel{position:absolute;inset:0;width:100%;height:100%;overflow:visible;fill:none}
.wcz-kabel path{stroke:#4d453f;stroke-width:4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.wcz-kabel path+path{stroke:rgba(239,233,221,.42);stroke-width:1.5;stroke-dasharray:5 7}
.wcz-girlanda>b{position:absolute;top:13.3%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#d9d0c2 0 18%,#8d857b 46%,#3f3934 100%)}
.wcz-lampa{position:absolute;width:var(--wl);margin-left:calc(var(--wl) / -2);transform-origin:50% 0;
  animation:wczBuja 2.3s ease-in-out -.4s infinite alternate;will-change:transform}
.wcz-lampa:nth-of-type(4n+2){animation-duration:2.7s;animation-delay:-1.5s;--a:2.4deg}
.wcz-lampa:nth-of-type(4n+3){animation-duration:2.05s;animation-delay:-.9s;--a:3.8deg}
.wcz-lampa:nth-of-type(4n){animation-duration:2.5s;animation-delay:-2.1s;--a:2.9deg}
.wcz-lampa>img{position:relative;display:block;width:100%;height:auto;aspect-ratio:200/197;object-fit:cover;object-position:0 0}
.wcz-lampa.k1>img{object-position:50% 0}
.wcz-lampa.k2>img{object-position:100% 0}
/* poświata: koło 3 × szerokości lampy ze środkiem w kuli; kolor z klasy k0/k1/k2 */
.wcz-lampa>i{position:absolute;left:50%;top:63%;width:300%;aspect-ratio:1;margin:-150% 0 0 -150%;border-radius:50%;--c:236,26,131;
  background:radial-gradient(closest-side,rgba(var(--c),.62),rgba(var(--c),.26) 38%,rgba(var(--c),.07) 70%,rgba(var(--c),0));
  opacity:.4;animation:wczSwiatlo calc(var(--wt) * 3) linear infinite;will-change:transform,opacity}
/* żar: jasna plama na kuli, zapala się razem z poświatą (lampa nie tylko rzuca światło, ale sama jaśnieje) */
.wcz-lampa>i+i{top:60%;width:64%;margin:-32% 0 0 -32%;background:radial-gradient(closest-side,rgba(255,255,255,.5),rgba(255,255,255,.16) 55%,rgba(255,255,255,0));
  opacity:.15;animation-name:wczZar}
.wcz-lampa.k1>i{--c:234,163,43;animation-delay:calc(var(--wt) * -2)}
.wcz-lampa.k2>i{--c:166,216,97;animation-delay:calc(var(--wt) * -1)}
@media (max-width:700px){.wcz-lampa:nth-of-type(even){display:none}}
.wcz-scena{position:relative;display:flex;flex-direction:column;align-items:center;width:clamp(160px,32vh,380px)}
.wcz-promienie{position:absolute;left:50%;top:44%;width:250%;aspect-ratio:1;margin:-125% 0 0 -125%;border-radius:50%;
  background:repeating-conic-gradient(rgba(236,26,131,.30) 0 9deg,rgba(236,26,131,0) 9deg 18deg);
  -webkit-mask:radial-gradient(closest-side,#000 18%,rgba(0,0,0,0) 94%);mask:radial-gradient(closest-side,#000 18%,rgba(0,0,0,0) 94%);
  animation:wczObrot 30s linear infinite;will-change:transform}
/* Naklejka z żabą pulsuje w rytm muzyki menu, tak jak naklejka z nazwą gry w samym menu (menu-koncert.js: pulsLogo):
   skok na każdą stopę utworu „Dub Riot” i wygaszenie w ok. 0,16 s. --wt to jedna ćwierćnuta (128 BPM = .46875 s), takt
   ma cztery, a stopy padają na 0, 1,5, 2 i 2,75 ćwierćnuty (wczPuls). Zasłona utworu podmienia --wt na tempo piosenki
   i pulsuje równo co ćwierćnutę (wczPulsTakt w gry.css). Faza zgadza się z zegarem menu (wczytywanie.js). */
.wcz-zaba{position:relative;width:100%;height:auto;transform-origin:50% 62%;animation:wczPuls calc(var(--wt) * 4) linear infinite;will-change:transform}
.wcz-cien{position:relative;width:58%;height:clamp(8px,1.4vh,14px);margin-top:2px;border-radius:50%;background:rgba(0,0,0,.5);
  animation:wczPuls calc(var(--wt) * 4) linear infinite;will-change:transform}
.wcz-rytm{position:relative;display:flex;align-items:flex-end;gap:7px;height:clamp(24px,4vh,44px)}
.wcz-rytm>i{width:9px;height:100%;border-radius:3px;background:#ec1a83;transform-origin:50% 100%;transform:scaleY(.2);
  animation:wczRytm .62s ease-in-out infinite alternate;will-change:transform}
.wcz-rytm>i:nth-child(3n+2){background:#eaa32b}
.wcz-rytm>i:nth-child(3n){background:#a6d861}
.wcz-rytm>i:nth-child(2){animation-duration:.47s;animation-delay:-.2s}
.wcz-rytm>i:nth-child(3){animation-duration:.78s;animation-delay:-.5s}
.wcz-rytm>i:nth-child(4){animation-duration:.53s;animation-delay:-.1s}
.wcz-rytm>i:nth-child(5){animation-duration:.7s;animation-delay:-.35s}
.wcz-rytm>i:nth-child(6){animation-duration:.44s;animation-delay:-.3s}
.wcz-rytm>i:nth-child(7){animation-duration:.66s;animation-delay:-.6s}
.wcz-rytm>i:nth-child(8){animation-duration:.5s;animation-delay:-.15s}
.wcz-rytm>i:nth-child(9){animation-duration:.74s;animation-delay:-.4s}
.wcz-pasek{position:relative;width:min(520px,64vw);height:20px;border-radius:999px;background:#0f0e0d;outline:2px dashed rgba(239,233,221,.38);outline-offset:4px;overflow:hidden}
/* wypełnienie przesuwa się (translateX), nie rozciąga, więc paski zostają równe; paski „idą” w ::before, też samym transformem */
.wcz-pasek>i{position:relative;display:block;height:100%;border-radius:inherit;overflow:hidden;background:#ec1a83;transform:translateX(-96%);transition:transform .25s ease-out;will-change:transform}
.wcz-pasek>i::before{content:"";position:absolute;inset:0 0 0 -40px;
  background:linear-gradient(rgba(255,255,255,.30),rgba(255,255,255,0) 58%),repeating-linear-gradient(-45deg,#ec1a83 0 10px,#f4589f 10px 20px);
  animation:wczPasy .7s linear infinite;will-change:transform}
@keyframes wczPuls{0%{transform:scale(1.07);animation-timing-function:cubic-bezier(.08,.6,.3,1)}35.9%{transform:scale(1.001);animation-timing-function:linear}
  37.5%{transform:scale(1.07);animation-timing-function:cubic-bezier(.2,.5,.5,1)}48.4%{transform:scale(1.016);animation-timing-function:linear}
  50%{transform:scale(1.07);animation-timing-function:cubic-bezier(.15,.55,.4,1)}67.15%{transform:scale(1.008);animation-timing-function:linear}
  68.75%{transform:scale(1.07);animation-timing-function:cubic-bezier(.1,.6,.3,1)}98.4%{transform:scale(1.002);animation-timing-function:linear}
  100%{transform:scale(1.07)}}
@keyframes wczObrot{to{transform:rotate(360deg)}}
@keyframes wczRytm{from{transform:scaleY(.16)}to{transform:scaleY(1)}}
@keyframes wczPasy{to{transform:translateX(28.284px)}}
@keyframes wczBuja{from{transform:rotate(calc(-1 * var(--a,3.2deg)))}to{transform:rotate(var(--a,3.2deg))}}
@keyframes wczSwiatlo{0%{opacity:.4;transform:scale(.88)}5%{opacity:1;transform:scale(1.1)}36%{opacity:.4;transform:scale(.88)}100%{opacity:.4;transform:scale(.88)}}
@keyframes wczZar{0%{opacity:.15;transform:scale(.9)}5%{opacity:1;transform:scale(1.05)}36%{opacity:.15;transform:scale(.9)}100%{opacity:.15;transform:scale(.9)}}
@media (prefers-reduced-motion:reduce){.wcz-zaba,.wcz-cien,.wcz-promienie,.wcz-rytm>i,.wcz-pasek>i::before,.wcz-lampa,.wcz-lampa>i{animation:none}.wcz-lampa>i{opacity:.75}.wcz-lampa>i+i{opacity:.5}.wcz-rytm>i:nth-child(odd){transform:scaleY(.7)}.wcz-rytm>i:nth-child(even){transform:scaleY(.4)}}

html.wczytuje .menu,html.wczytuje .menu *{animation-play-state:paused!important}
</style>

<script>
"use strict";
// HARNESS 2/2: parametry adresu → ZC.init (opis na górze pliku). window.ff to skrót jak w harnessach Syntha.
// Podgląd stopni sceny (?widownia= ?streak= ?tlo= ?klawisze= ?stopien= ?gl=0 ?moc= ?odblokuj=1) ZC.init czyta sam z adresu.
(function(){
  const Q=new URLSearchParams(location.search);
  const liczba=(k,d)=>{const v=Q.get(k);return v!=null&&v!==""&&Number.isFinite(+v)?+v:d;};
  const tak=k=>Q.has(k)&&!/^(0|false|nie)$/i.test(Q.get(k)||"1");
  const partie=Q.get("partie");
  ZC.init({
    // boty: poziom z lobby (Średni, jeśli nikt nie wybrał), a ?luz=0..1 to dawny jeden suwak niedbałości
    piosenka:Q.get("piosenka"),boty:liczba("boty",0),luz:Q.has("luz")?liczba("luz",.3):null,ziarno:liczba("ziarno",7),
    mysz:tak("mysz"),auto:tak("auto"),czekaj:liczba("czekaj",3),
    // w aplikacji (ten sam origin co /stream) kapsle są od razu; ?zywe=0 wyłącza, ?zywe=1 włącza gdzie indziej
    zywe:Q.has("zywe")?tak("zywe"):/^\/web\/gry\//.test(location.pathname),
    tempo:liczba("tempo",null),glos:Q.get("glos"),latwy:Q.has("latwy")?tak("latwy"):null,fps:tak("fps"),
    partie:partie==null?null:(partie==="kolejno"?partie:partie.split(",").map(Number))});
  window.ff=ZC.ff;
})();
</script>
